name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dagger/dagger-for-github v6.15.1
      - uses: dagger/dagger-for-github@f599d88d336fdf06f01f9bd24b6339954f7ba3e2
        with:
          version: "0.21.8"
          verb: call
          args: ci --src .
          dagger-flags: >-
            --progress plain
            --cache-to type=gha,mode=max,scope=ci
            --cache-from type=gha,scope=ci
