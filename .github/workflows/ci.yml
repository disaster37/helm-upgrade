name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v6
        with:
          version: "0.21.8"
          verb: call
          args: ci --src .
          dagger-flags: >-
            --progress plain
            --cache-to type=gha,mode=max
            --cache-from type=gha
